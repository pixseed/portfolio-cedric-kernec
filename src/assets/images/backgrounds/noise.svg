<svg
  xmlns="http://www.w3.org/2000/svg"
  width="180"
  height="180"
  viewBox="0 0 180 180"
>
  <!-- Génère un grain gris dont les bords se raccordent à la répétition. -->
  <filter id="noise">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.85"
      numOctaves="3"
      stitchTiles="stitch"
    />
    <feColorMatrix type="saturate" values="0" />
  </filter>

  <!-- Limite l'intensité de la texture sans modifier les autres fonds. -->
  <rect
    width="100%"
    height="100%"
    opacity="0.15"
    filter="url(#noise)"
  />
</svg>
