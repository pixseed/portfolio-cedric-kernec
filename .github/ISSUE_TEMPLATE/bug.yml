name: "Bug"
description: "Signaler un dysfonctionnement"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décrire clairement le problème rencontré.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire le bug
      placeholder: |
        1. Aller sur...
        2. Cliquer sur...
        3. Observer...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Décrire ce qui devrait normalement se produire.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Informations complémentaires
      description: Navigateur, appareil, capture d'écran ou toute information utile.
    validations:
      required: false